<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선택 과목 변경 희망 심의 신청 기간 안내</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e9eff5;
      padding: 16px;
    }

    .notice-image {
      max-width: min(100%, 960px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>
  <img
    src="notice.jpg"
    alt="선택 과목 변경 희망 심의 신청 기간이 아닙니다. 신청 기간 : 2026년 11월 23일(월) ~ 11월 25일(수)"
    class="notice-image"
  >
</body>
</html>
