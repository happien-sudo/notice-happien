<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027학년도 선택 과목 변경 심의신청</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #193252;
      padding: 16px;
    }

    .notice-image {
      max-width: min(100%, 960px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      display: block;
    }
  </style>
</head>
<body>
  <img
    src="notice.jpg"
    alt="변경 신청기간이 아닙니다."
    class="notice-image"
  >
</body>
</html>
